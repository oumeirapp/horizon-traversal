[package]
name = "x-traversal"
version = "0.1.0"
description = "Collect and optimize approved ticket assets"
authors = ["Horizon"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "x_traversal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
filetime = "0.2.29"
thiserror = "2.0.19"
image = { version = "=0.25.9", default-features = false, features = ["jpeg", "png"] }
pdfium-render = { version = "=0.9.3", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3.27.0"
