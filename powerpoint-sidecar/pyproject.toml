[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-pptx"
version = "0.1.0"
description = "Build Horizon PowerPoint decks from native schema-v1 manifests."
requires-python = ">=3.11"
dependencies = [
  "defusedxml>=0.7.1",
  "Pillow>=11.0",
]

[project.optional-dependencies]
dev = ["lxml>=5.3", "pytest>=8.3"]
bundle = ["pyinstaller>=6.11"]

[project.scripts]
horizon-pptx = "horizon_pptx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_pptx"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

